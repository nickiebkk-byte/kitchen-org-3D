<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จัดระเบียบตู้ครัว 3D</title>
<meta name="description" content="วางแผนจัดกล่องและตะกร้าในตู้แขวน ตู้ล่าง ใต้ซิงก์ และลิ้นชัก แบบ 3D และ 2D พร้อมขนาด ซม.">
<meta name="theme-color" content="#0755b5">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ตู้ครัว 3D">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="ตู้ครัว 3D">
<meta name="msapplication-TileColor" content="#0755b5">
<meta name="msapplication-TileImage" content="icons/mstile-150.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: workbench — settings rail | 3D cabinet stage | product catalogue, stacks on phones */
:root{
  --bg:#eef1ef; --panel:#ffffff; --line:#d6ddd9; --fg:#1d2624; --muted:#5f6d69;
  --accent:#17675f; --accent-soft:#dcefeb; --warn:#c2410c; --warn-soft:#fdeee6;
  --scene:#e4e9e6; --wood:#d9c3a0;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2220; --line:#2c3835; --fg:#e4ebe8; --muted:#94a39f;
  --accent:#4fc1b2; --accent-soft:#163631; --warn:#fb8a4f; --warn-soft:#3a2216;
  --scene:#1b2321; --wood:#8a7556; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --panel:#1a2220; --line:#2c3835; --fg:#e4ebe8; --muted:#94a39f;
  --accent:#4fc1b2; --accent-soft:#163631; --warn:#fb8a4f; --warn-soft:#3a2216;
  --scene:#1b2321; --wood:#8a7556; color-scheme:dark}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
.top h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.zones{display:flex;gap:6px;flex-wrap:wrap}
.zones button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;display:flex;gap:6px;align-items:center}
.zones button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.zones .cnt{font-family:var(--f-mono);font-size:11px;opacity:.75}
body{display:flex;flex-direction:column}
.app{flex:none;height:max(600px,calc(100vh - 72px));display:grid;grid-template-columns:260px minmax(0,1fr) 320px}
.rail,.cat{background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.rail{border-right:1px solid var(--line)} .cat{border-left:1px solid var(--line)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dims label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.dims input,.row input,.row select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);font-family:var(--f-mono);font-size:13px}
.row{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:8px}
.row label{flex:1}
.levels{display:flex;flex-direction:column-reverse;gap:4px}
.levels button{display:flex;justify-content:space-between;border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 10px;text-align:left;font-size:13px}
.levels button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.levels .m{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.stage{position:relative;min-width:0;background:var(--scene)}
#view{position:absolute;inset:0;touch-action:none}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:2;pointer-events:none}
.hud>*{pointer-events:auto}
.hud button,.tool button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;font-size:13px}
.hud button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.size{margin-left:auto;pointer-events:none !important;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-family:var(--f-mono);font-size:12px}
.tool{z-index:2;position:absolute;left:12px;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.tool .nm{flex:1 1 220px;min-width:0}
.tool .nm b{display:block;font-size:13px}
.tool .nm span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tool .btns{display:flex;gap:6px;flex-wrap:wrap}
.tool .del{color:var(--warn)}
.tool .wbox{display:flex;gap:6px;align-items:center;font-size:12px}
.issues{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.toast{z-index:3;position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.filter{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px}
.filter button{flex:1;border:0;background:transparent;border-radius:6px;padding:5px;font-size:13px}
.filter button[aria-pressed="true"]{background:var(--panel);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h3{font-size:14px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp h3 span{font-size:11px;font-weight:400;color:var(--muted)}
.prod{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;background:transparent;text-align:left;width:100%}
.prod:hover{border-color:var(--accent)}
.prod img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:4px}
.prod .t{font-size:13px;line-height:1.3}
.prod .s{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.prod .zs{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.prod .zs .chip{font-size:10px;padding:0 6px}
.prod .add{font-size:20px;color:var(--accent);padding:0 4px}
.prod.dim{opacity:.55}
.sum{display:flex;flex-direction:column;gap:6px}
.foot{background:var(--panel);border-top:1px solid var(--line);padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sum{max-width:1100px;margin:0 auto}
.sumhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sumhead h2{margin:0;font-size:14px}
#sum{overflow-x:auto}
.sum table{width:100%;border-collapse:collapse;font-size:13px}
.sum th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);letter-spacing:.06em}
.sum th.q{text-align:right}
.sum td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.sum td.q{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.sum td.k{font-family:var(--f-mono);color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:6px;padding:7px 12px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.empty{font-size:12px;color:var(--muted)}
textarea.copy{width:100%;height:90px;font-family:var(--f-mono);font-size:11px}
.cabs{display:flex;flex-wrap:wrap;gap:4px}
.cabs button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px;display:flex;flex-direction:column;line-height:1.25;text-align:left}
.cabs button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cabbtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cabbtn button{border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px}
.cabbtn .del{border-style:solid;border-color:var(--line);color:var(--warn)}
.cabbtn button:disabled{opacity:.4;cursor:default}
#plan{position:absolute;inset:0;background:var(--panel);padding:52px 12px 150px;overflow:auto}
#plan svg{width:100%;max-width:1100px;height:auto;margin:0 auto;display:block;touch-action:none;user-select:none}
#plan .dm line{stroke:var(--fg);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .dm text,#plan .lb{fill:var(--fg);font-family:var(--f-mono)}
#plan .gap line{stroke:var(--accent)} #plan .gap text{fill:var(--accent)}
#plan .ttl{fill:var(--muted);font-family:var(--f-body)}
#plan .co{fill:var(--wood);stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .ci{fill:var(--bg);stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
#plan .ci.act{fill:var(--accent-soft)}
#plan .sh{fill:var(--wood)}
#plan .it{stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:grab}
#plan .it.k-clear,#plan .it.k-tray,#plan .it.k-drawer{fill:rgba(120,190,215,.35);stroke:#3b8fae}
#plan .it.k-basket,#plan .it.k-shelf{fill:rgba(225,228,224,.85);stroke:#7d8784}
#plan .it.k-deco{fill:rgba(245,243,238,.9);stroke:#8d9592;stroke-dasharray:3 2}
#plan .it.k-rack{fill:rgba(107,114,112,.45);stroke:#3d4341}
#plan .it.bad{stroke:var(--warn);fill:var(--warn-soft)}
#plan .it.sel{stroke:var(--accent);stroke-width:2.5}
#plan .pipe{fill:var(--warn-soft);stroke:var(--warn);stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
#plan .front{stroke:var(--muted);stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.line{display:flex;flex-direction:column;gap:8px}
@media (min-width:981px){
  .app{grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"rail cat" "stage cat"}
  .rail{grid-area:rail;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:12px 28px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .stage{grid-area:stage} .cat{grid-area:cat}
  .rail section{display:flex;flex-direction:column;gap:6px;min-width:0}
  .rail h2{margin:0}
  .line{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:8px 12px}
  .cabbtn{margin-top:0}
  .dims{grid-template-columns:repeat(3,64px)}
  .rail{gap:10px 24px;padding-block:10px}
  .cabs button{padding:2px 8px}
  .row{margin-top:0;padding-bottom:6px}
  .row label{flex:none}
  .rail .hint{display:none}
  .levels{flex-direction:row;flex-wrap:wrap}
  .levels button{flex-direction:column;gap:0;line-height:1.3;padding:4px 10px}
  .lvhint{display:none}
}
@media (max-width:980px){
  .app{grid-template-columns:1fr;height:auto}
  .sum td.empty,.sum th:nth-child(3){display:none}
  .stage{height:62vh;min-height:380px;order:-1}
  .rail,.cat{border:0;border-top:1px solid var(--line);overflow:visible}
  .rail,.cat{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<link rel="stylesheet" href="theme-blue-orange.css">
</head>
<body>

<header class="top">
  <h1>จัดระเบียบตู้ครัว 3D<small>วางกล่องและตะกร้าในตู้ของคุณ ดูว่าใส่พอดีไหม</small></h1>
  <nav class="zones" id="zones" aria-label="เลือกโซน"></nav>
</header>

<main class="app">
  <aside class="rail">
    <section>
      <h2>ตู้ในโซนนี้</h2>
      <div class="line">
      <div class="cabs" id="cabs"></div>
      <div class="cabbtn">
        <button id="addL">+ เพิ่มตู้ซ้าย</button>
        <button id="addR">+ เพิ่มตู้ขวา</button>
        <button id="delCab" class="del">ลบตู้นี้</button>
      </div>
      </div>
    </section>
    <section>
      <h2 id="dimTitle">ขนาดภายในตู้ (ซม.)</h2>
      <div class="line">
      <div class="dims">
        <label>กว้าง<input id="cw" type="number" min="10" max="200" step="0.5"></label>
        <label>ลึก<input id="cd" type="number" min="10" max="100" step="0.5"></label>
        <label>สูง<input id="ch" type="number" min="3" max="200" step="0.5"></label>
      </div>
      <div class="row" id="shelfRow"><label for="cs">จำนวนชั้นภายใน</label><select id="cs" style="width:70px"></select></div>
      <div class="row" id="pipeRow"><label for="cp">มีท่อน้ำทิ้งกลางตู้</label><input id="cp" type="checkbox" style="width:auto"></div>
      </div>
      <p class="hint" id="zoneHint"></p>
    </section>
    <section>
      <h2>ช่องที่จะวางของ</h2>
      <div class="levels" id="levels"></div>
      <p class="hint lvhint">กดสินค้าทางขวาเพื่อวางในช่องที่เลือก ลากกล่องเพื่อย้าย ลากทับกล่องอื่นเพื่อวางซ้อน</p>
    </section>
  </aside>

  <section class="stage">
    <div id="view"></div>
    <div class="hud" role="group" aria-label="มุมมอง">
      <button data-v="iso" aria-pressed="true">3D</button>
      <button data-v="front">ด้านหน้า</button>
      <button data-v="top">ด้านบน</button>
      <button data-v="2d">2D (ซม.)</button>
      <div class="size" id="sizeTag"></div>
    </div>
    <div id="plan" hidden></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="tool" id="tool" hidden>
      <div class="nm"><b id="tName"></b><span id="tDim"></span></div>
      <div class="wbox" id="tW" hidden><label for="tWr">ปรับกว้าง</label><input id="tWr" type="range" min="30" max="58.5" step="0.5"><span id="tWv" class="m"></span></div>
      <div class="btns">
        <button id="bRot" title="หมุนรอบแนวตั้ง 90° (สลับกว้าง/ลึก)">↻ หมุน 90°</button>
        <button id="bTilt" title="พลิกตั้ง/นอน">⤾ พลิกตั้ง/นอน</button>
        <button id="bSide" title="ตะแคงข้าง">⇆ ตะแคง</button>
        <button id="bCL" title="ย้ายไปตู้ทางซ้าย">◀ ตู้ซ้าย</button>
        <button id="bCR" title="ย้ายไปตู้ทางขวา">ตู้ขวา ▶</button>
        <button id="bUp" title="ย้ายขึ้นช่องบน">▲</button>
        <button id="bDn" title="ย้ายลงช่องล่าง">▼</button>
        <button id="bDup">ทำซ้ำ</button>
        <button id="bDel" class="del">ลบ</button>
      </div>
      <div class="issues" id="tIss"></div>
    </div>
  </section>

  <aside class="cat">
    <div>
      <h2>สินค้า (แยกตามประเภท)</h2>
      <div class="filter" role="group" aria-label="ตัวกรองสินค้า">
        <button id="fZone" aria-pressed="true">แนะนำสำหรับโซนนี้</button>
        <button id="fAll" aria-pressed="false">ทั้งหมด</button>
      </div>
    </div>
    <div id="cat" style="display:flex;flex-direction:column;gap:18px"></div>
  </aside>
</main>
<footer class="foot">
  <section class="sum">
    <div class="sumhead">
      <h2>รายการสินค้าที่ใช้ (ทุกโซน)</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn" id="copyBtn">คัดลอกรายการ</button>
        <button class="btn ghost" id="clearBtn">ล้างโซนนี้</button>
      </div>
    </div>
    <div id="sum"></div>
    <textarea class="copy" id="copyTxt" hidden readonly aria-label="รายการสินค้า"></textarea>
  </section>
</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

function settle(c,level,dragId){
  const L=levels(c)[level]; if(!L) return;
  const its=c.items.filter(i=>i.level===level);
  its.sort((a,b)=>(a.id===dragId?1e9:a.y)-(b.id===dragId?1e9:b.y));
  const done=[];
  for(const i of its){

      if(ov(i.x-e.x/2,i.x+e.x/2,s.x-f.x/2,s.x+f.x/2)&&ov(i.z-e.z/2,i.z+e.z/2,s.z-f.z/2,s.z+f.z/2)) base=Math.max(base,s.y+f.y);}

}

    add(W+2*T,H+2*T,T,0,H/2,-D/2-T/2,woodBack);

$('bDel').onclick=()=>{const f=findSel();if(!f)return;f.c.items=f.c.items.filter(x=>x!==f.i);sel=null;settle(f.c,f.i.level);refresh(false);};
$('bDup').onclick=()=>{const f=findSel();if(!f)return;const n={...f.i,id:uid++,rq:[...f.i.rq]};f.c.items.push(n);place(n,f.c);settle(f.c,n.level);sel=n.id;refresh(false);};
$('tWr').oninput=e=>{const f=findSel();if(!f)return;f.i.wv=+e.target.value;clampXZ(f.i,f.c);settle(f.c,f.i.level);refresh(false);};
function addCab(side){
  const a=AC(), cs=cabs(), idx=S.ac[S.zone]+(side>0?1:0);
  cs.splice(idx,0,{id:uid++,W:a.W,D:a.D,H:a.H,S:a.S,P:S.zone==='sink'?false:a.P,al:0,items:[]});
  S.ac[S.zone]=idx; sel=null; loadForm(); refresh(true);
  toast(`เพิ่มตู้${side>0?'ขวา':'ซ้าย'}แล้ว ปรับขนาดได้ทางซ้ายมือ`);
}
$('addL').onclick=()=>addCab(-1);
$('addR').onclick=()=>addCab(1);
let delArm=false;
$('delCab').onclick=e=>{
  if(cabs().length<2) return;
  if(!delArm){delArm=true;e.target.textContent='กดอีกครั้งเพื่อลบ';setTimeout(()=>{delArm=false;e.target.textContent='ลบตู้นี้';},2500);return;}
  delArm=false;e.target.textContent='ลบตู้นี้';
  cabs().splice(S.ac[S.zone],1); S.ac[S.zone]=Math.max(0,S.ac[S.zone]-1); sel=null; loadForm(); refresh(true);
};

/* ---------- UI ---------- */
function showTool(){
  const tool=$('tool'), f=findSel();
  if(!f){tool.hidden=true;return;}
  tool.hidden=false; const {i,c,k}=f, p=PBY[i.sku], e=ext(i);
  $('tName').textContent=`${p.sku} · ${p.n}`;
  $('tDim').textContent=`ขณะวาง: กว้าง ${fmt(e.x)} × ลึก ${fmt(e.z)} × สูง ${fmt(e.y)} ซม. · ตู้ ${k+1} ช่อง ${i.level+1}`;
  $('tW').hidden=!p.adj;
  if(p.adj){$('tWr').value=i.wv;$('tWv').textContent=fmt(i.wv)+' ซม.';}
  const iss=issues(i,c);
  $('tIss').innerHTML=iss.length?iss.map(s=>`<span class="chip w">${s}</span>`).join(''):'<span class="chip">ใส่ได้พอดี</span>';
  $('bUp').disabled=i.level>=levels(c).length-1; $('bDn').disabled=i.level<=0;
  $('bCL').disabled=k<=0; $('bCR').disabled=k>=cabs().length-1;
  $('bCL').hidden=$('bCR').hidden=cabs().length<2;
}
function renderZones(){
  $('zones').innerHTML=Object.entries(ZONES).map(([k,v])=>{
    const n=S[k].cabs.reduce((s,c)=>s+c.items.length,0);
    return `<button data-z="${k}" aria-pressed="${S.zone===k}">${v.n}<span class="cnt">${n||''}</span></button>`;}).join('');
}
$('zones').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.zone=b.dataset.z;sel=null;loadForm();refresh(true);};
function renderCabs(){
  const cs=cabs(), ai=S.ac[S.zone];
  $('cabs').innerHTML=cs.map((c,j)=>`<button data-c="${j}" aria-pressed="${j===ai}">ตู้ ${j+1}<small>${fmt(c.W)}×${fmt(c.D)}×${fmt(c.H)}</small></button>`).join('');
  $('delCab').disabled=cs.length<2;
  $('dimTitle').textContent=`ขนาดภายใน ตู้ ${ai+1} (ซม.)`;
}
$('cabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.ac[S.zone]=+b.dataset.c;sel=null;loadForm();refresh(false);};
const cw=$('cw'),cd=$('cd'),ch=$('ch'),cs=$('cs'),cp=$('cp');
function loadForm(){
  const c=AC();
  cw.value=c.W;cd.value=c.D;ch.value=c.H;
  $('shelfRow').hidden=!(S.zone==='upper'||S.zone==='lower');
  cs.innerHTML=[0,1,2,3,4].map(n=>`<option ${n===c.S?'selected':''}>${n}</option>`).join('');
  $('pipeRow').hidden=S.zone!=='sink'; cp.checked=!!c.P;
  $('zoneHint').textContent=ZONES[S.zone].hint; $('dimTitle').parentElement.title=ZONES[S.zone].hint;
}
function formChange(){
  const c=AC(); const num=(el,lo,hi,old)=>{const v=parseFloat(el.value);return isFinite(v)?Math.min(hi,Math.max(lo,v)):old;};
  c.W=num(cw,10,200,c.W);c.D=num(cd,10,100,c.D);c.H=num(ch,3,200,c.H);c.S=+cs.value;c.P=cp.checked;
  c.items.forEach(i=>clampXZ(i,c)); settleCab(c); refresh(true);
}
[cw,cd,ch].forEach(el=>el.addEventListener('change',formChange));cs.onchange=formChange;cp.onchange=formChange;
function renderLevels(){
  const c=AC(), L=levels(c);
  $('levels').innerHTML=L.map((l,k)=>{
    const n=c.items.filter(i=>i.level===k).length;
    const label=L.length===1?'พื้นตู้':(k===0?'ช่อง 1 (ล่างสุด)':k===L.length-1?`ช่อง ${k+1} (บนสุด)`:`ช่อง ${k+1}`);
    return `<button data-l="${k}" aria-pressed="${k===c.al}"><span>${label}</span><span class="m">สูง ${fmt(l.c)} ซม. · ${n} ชิ้น</span></button>`;}).join('');
}
$('levels').onclick=e=>{const b=e.target.closest('button');if(!b)return;AC().al=+b.dataset.l;buildCab();renderLevels();render2D();save();};
function renderCat(){
  const zn=S.zone, zs={upper:'ตู้บน',lower:'ตู้ล่าง',sink:'ใต้ซิงก์',drawer:'ลิ้นชัก'};
  $('cat').innerHTML=GROUPS.map(g=>{
    let ps=P.filter(p=>p.g===g.id); const rec=ps.filter(p=>p.z.includes(zn));
    if(filterZone){ if(!rec.length) return ''; ps=rec; }
    return `<div class="grp"><h3>${g.n}<span>${g.note||ps.length+' ขนาด'}</span></h3>${ps.map(p=>{
      const dim=p.adj?`${p.adj[0]}–${p.adj[1]} × ${fmt(p.d)} × ${fmt(p.h)}`:`${fmt(p.w)} × ${fmt(p.d)} × ${fmt(p.h)}`;
      return `<button class="prod ${p.z.includes(zn)?'':'dim'}" data-s="${p.sku}" title="เพิ่มลงตู้และช่องที่เลือก">
        <img src="${THUMB[p.sku]||''}" alt="" loading="lazy">
        <span><span class="t">${p.n}</span><br><span class="s">${p.deco?'':p.sku+' · '}ก×ล×ส ${dim} ซม.</span>
        <span class="zs">${p.z.map(z=>`<span class="chip">${zs[z]}</span>`).join('')}</span></span>
        <span class="add" aria-hidden="true">+</span></button>`;}).join('')}</div>`;
  }).join('');
}
$('cat').onclick=e=>{const b=e.target.closest('.prod');if(b)addProduct(b.dataset.s);};
const fz=$('fZone'),fa=$('fAll');
fz.onclick=()=>{filterZone=true;fz.setAttribute('aria-pressed',true);fa.setAttribute('aria-pressed',false);renderCat();};
fa.onclick=()=>{filterZone=false;fz.setAttribute('aria-pressed',false);fa.setAttribute('aria-pressed',true);renderCat();};
function summary(){
  const rows={};
  ZK.forEach(z=>S[z].cabs.forEach(c=>c.items.forEach(i=>{if(PBY[i.sku].deco)return;const r=rows[i.sku]||(rows[i.sku]={q:0,z:{}});r.q++;r.z[z]=(r.z[z]||0)+1;})));
  return Object.entries(rows).sort((a,b)=>GROUPS.findIndex(g=>g.id===PBY[a[0]].g)-GROUPS.findIndex(g=>g.id===PBY[b[0]].g));
}
function renderSum(){
  const s=summary();
  const tot=s.reduce((a,[,r])=>a+r.q,0);
  $('sum').innerHTML=s.length?`<table><thead><tr><th>SKU</th><th>สินค้า</th><th>ใช้ในโซน</th><th class="q">จำนวน</th></tr></thead><tbody>${s.map(([sku,r])=>`<tr><td class="k">${sku}</td><td>${PBY[sku].n}</td><td class="empty">${Object.entries(r.z).map(([k,n])=>ZONES[k].n+' '+n).join(' · ')}</td><td class="q">${r.q} ชิ้น</td></tr>`).join('')}<tr><td></td><td><b>รวม ${s.length} รายการ</b></td><td></td><td class="q"><b>${tot} ชิ้น</b></td></tr></tbody></table>`:'<p class="empty">ยังไม่มีสินค้า กดสินค้าทางขวาเพื่อเริ่มจัด</p>';
}
$('copyBtn').onclick=()=>{
  const s=summary(); const txt=['รายการจัดระเบียบตู้ครัว'].concat(s.map(([sku,r])=>`${sku}  ${PBY[sku].n}  x${r.q}`)).join('\n');
  const ta=$('copyTxt');
  navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกรายการแล้ว')).catch(()=>{ta.hidden=false;ta.value=txt;ta.select();toast('กด Ctrl/⌘+C เพื่อคัดลอก');});
};
let clearArm=false;
$('clearBtn').onclick=e=>{
  if(!clearArm){clearArm=true;e.target.textContent='กดอีกครั้งเพื่อยืนยัน';setTimeout(()=>{clearArm=false;e.target.textContent='ล้างโซนนี้';},2500);return;}
  cabs().forEach(c=>c.items=[]);sel=null;clearArm=false;e.target.textContent='ล้างโซนนี้';refresh(false);
};
document.querySelector('.hud').onclick=e=>{const b=e.target.closest('button[data-v]');if(b)frame(b.dataset.v);};
addEventListener('keydown',e=>{
  if(sel===null||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==='r'||e.key==='R')$('bRot').click();
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();$('bDel').click();}
});
function refresh(reframe){
  buildCab();buildItems();renderZones();renderCabs();renderLevels();renderCat();renderSum();showTool();
  const cs=cabs(), tot=cs.reduce((s,c)=>s+c.W+2*T,0);
  $('sizeTag').textContent=`${ZONES[S.zone].n} · ${cs.length} ตู้ · กว้างรวม ${fmt(tot)} ซม.`;
  if(reframe) frame(viewMode==='2d'?'2d':(S.zone==='drawer'?'top':last3d==='top'?'iso':last3d));
  else render2D();
  save();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeScene);
new MutationObserver(themeScene).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
scene.background=new THREE.Color(css('--scene'));
resize(); loadForm(); ZK.forEach(z=>{const o=S.zone;S.zone=z;S[z].cabs.forEach(settleCab);S.zone=o;}); refresh(true);

</script>
</body>
</html>
